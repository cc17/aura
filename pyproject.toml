[project]
name = "aura"
version = "0.1.0"
description = "Aura AI Agent with pluggable tool system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "litellm>=1.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.0",
    "python-dotenv>=1.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "tiktoken>=0.7",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
